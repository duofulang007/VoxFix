      <path d="M65.6 34.16 H 73.84 V 42.4"/>
      <path d="M73.84 65.6 V 73.84 H 65.6"/>
      <path d="M42.4 73.84 H 34.16 V 65.6"/>
    </g>
    <path d="M45.11 45.11 L 54 62.89 L 62.89 45.11" stroke="#111111" stroke-width="4.29"/>
  </g>
</svg>

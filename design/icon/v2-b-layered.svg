<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108" role="img" aria-label="VoxFix 输入法 图标 B 分层">
  <!-- 几何同 A。取景框降为中性灰 #9CA1AA（约 38% 黑）作辅助层，V 保持 #111 主体层，

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>弧柄无线调试开关 · 动效稿 2026-11-09</title>
<style>
  :root{
    --ease: cubic-bezier(.32,.72,0,1);
    --disc: rgba(74,74,74,.70);
    --disc-on: rgba(74,74,74,.82);
    --glyph: rgba(255,255,255,.55);
    --glyph-on: rgba(255,255,255,.95);
    --ink:#1f2328; --sub:#6b7280; --line:#e3e5e8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#f4f5f7; color:var(--ink);
    font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; gap:56px; padding:36px 32px;
  }
  .panel{width:288px; flex:none}
  .panel h1{font-size:17px; font-weight:650; margin:0 0 8px; letter-spacing:.2px}
  .panel p{color:var(--sub); font-size:12.5px; margin:0 0 16px; line-height:1.75}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:12px}
  .row{display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:13px}
  .row + .row{border-top:1px solid #f3f4f6}
  .row label{cursor:pointer; user-select:none}
  input[type=checkbox]{appearance:none; width:34px; height:20px; border-radius:99px; background:#dfe1e4; position:relative; cursor:pointer; transition:background .18s; flex:none}
  input[type=checkbox]:checked{background:#3f6b52}
  input[type=checkbox]::after{content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; transition:transform .18s var(--ease)}
  input[type=checkbox]:checked::after{transform:translateX(14px)}
  .legend{font-size:12px; color:var(--sub); line-height:1.85}
  .legend b{color:var(--ink); font-weight:600}
  .state{font-family:ui-monospace,Consolas,monospace; font-size:11.5px; color:#4b5563; padding-top:9px; border-top:1px solid #f3f4f6; margin-top:6px}

  .phone{position:relative; width:390px; height:740px; background:#fff; border-radius:28px; flex:none;
         box-shadow:0 14px 44px rgba(20,24,30,.10), 0 0 0 1px rgba(20,24,30,.06); overflow:hidden}
  .screen{padding:26px 22px}
  .bar{display:flex; gap:6px; margin-bottom:26px}
  .bar i{width:56px; height:8px; border-radius:99px; background:#eceef1}
  .bar i:first-child{width:88px; background:#e2e5e9}
  .hint{font-size:12px; color:#9aa1ab; margin-bottom:22px}
  .block{height:12px; border-radius:6px; background:#f2f4f6; margin-bottom:11px}
  .block:nth-child(3n){width:62%}
  .block:nth-child(4n){width:84%}
  .bubble{margin-top:26px; padding:16px; border-radius:14px; background:#f7f8fa; color:#8b929c; font-size:12.5px; line-height:1.85}

  .handle{position:absolute; right:0; top:378px; width:24px; height:64px; cursor:pointer;
          display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent}
  .handle{transition:opacity .12s linear}
  .phone.open .handle{opacity:0; pointer-events:none}
  /* 弧线走向与已安装版本一致：弧顶朝屏幕内（"("），路径 M21,18 Q15,32 21,46，2dp 描边 */
  .handle .arc-path{fill:none; stroke:rgba(107,107,107,.42); stroke-width:2; stroke-linecap:round;
                    transition:stroke .2s linear, stroke-width .2s linear}
  /* 开启时弧线常驻激活态（更实 + 更粗）；不在弧下加圆点，24dp 边缘会被读成"!" */
  .phone.live .handle .arc-path{stroke:rgba(107,107,107,.82); stroke-width:2.6}

  .btn{position:absolute; width:48px; height:48px; border-radius:50%; display:block; cursor:pointer;
       -webkit-tap-highlight-color:transparent; transform:scale(.86); opacity:0; pointer-events:none;
       transition:transform .22s var(--ease), opacity .16s linear}
  .phone.open .btn{opacity:1; transform:scale(1); pointer-events:auto}
  .phone.open .btn.close{transition-delay:.04s}
  .phone.open .btn.shot{transition-delay:.08s}
  .phone.open .btn.adb{transition-delay:.12s}
  .btn.close{left:342px; top:386px}
  .btn.shot{left:290px; top:416px}
  .btn.adb{left:290px; top:356px}
  .btn svg{display:block; width:48px; height:48px; overflow:visible}
  .disc{fill:var(--disc); transition:fill .12s}
  .btn:active .disc{fill:var(--disc-on)}
  .ig{stroke:rgba(255,255,255,.88); fill:none; stroke-linecap:round; stroke-linejoin:round}

  /* ── 无线调试图标：关 = 压暗的三段弧 + 斜杠；开 = 提亮 + 外环呼吸 ── */
  .adb .ring{fill:none; stroke:var(--glyph-on); stroke-width:1.1; opacity:0; transform:scale(1.16); transform-origin:24px 24px;
             transition:opacity .18s linear, transform .26s var(--ease)}
  .adb .arc{fill:none; stroke:var(--glyph); stroke-width:2.4; opacity:.46;
            transition:opacity .16s var(--ease)}
  .adb .cdot{fill:var(--glyph); opacity:.58; transition:opacity .16s linear}
  .adb .slash{stroke:rgba(255,255,255,.82); stroke-width:2; opacity:1;
              stroke-dasharray:1; stroke-dashoffset:0;
              transition:opacity .12s linear .10s, stroke-dashoffset .14s linear .10s}

  .adb.on .ring{opacity:.42; transform:scale(1); animation:breathe 4s ease-in-out 1.1s infinite}
  .adb.on .slash{opacity:0; stroke-dashoffset:1; transition-delay:0s}
  .adb.on .cdot{opacity:1}
  .adb.on .arc{opacity:.95}
  .adb.on .a1{transition-delay:.04s}
  .adb.on .a2{transition-delay:.08s}
  .adb.on .a3{transition-delay:.12s}

  .adb:not(.on) .a1{transition-delay:0s}
  .adb:not(.on) .a2{transition-delay:.02s}
  .adb:not(.on) .a3{transition-delay:.04s}

  .btn.busy .adb .ring{opacity:1; stroke:rgba(255,255,255,.6); stroke-width:1.6; stroke-dasharray:3.6 3;
                       animation:spin .9s linear infinite; transition:none; transform:none}
  .btn.busy .adb .arc,.btn.busy .adb .slash,.btn.busy .adb .cdot{opacity:.3}

  .btn.shake{animation:shake .16s ease-in-out 2}
  .btn.flash .adb .ring{opacity:1; transform:none; animation:flash .28s ease-out 1}
  .btn{will-change:transform}

  .toast{position:absolute; left:50%; bottom:52px; transform:translate(-50%,8px); background:rgba(28,32,38,.9); color:#fff;
         font-size:12.5px; padding:9px 14px; border-radius:10px; max-width:300px; text-align:center; line-height:1.6;
         opacity:0; transition:opacity .16s, transform .16s var(--ease); pointer-events:none}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  @keyframes breathe{0%,100%{opacity:.45} 50%{opacity:.18}}
  @keyframes flash{0%{opacity:0} 55%{opacity:.95; stroke-width:2.6} 100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shake{0%,100%{transform:scale(1) translateX(0)} 25%{transform:scale(1) translateX(-3px)} 75%{transform:scale(1) translateX(3px)}}
  @keyframes dotPulse{0%,100%{opacity:1} 50%{opacity:.35}}
</style>
</head>
<body>

<div class="panel">
  <h1>弧柄 · 无线调试开关</h1>
  <p>点右侧弧柄展开，再点「无线调试」。关闭态是三段弧压暗 + 斜杠；开启时斜杠回抽、三段弧 40/80/120ms 由内向外提亮，外环落定后 4s 呼吸；收起后弧柄本身变实变粗。</p>

  <div class="card">
    <div class="row"><label for="wifi">模拟 Wi-Fi 未连接</label><input id="wifi" type="checkbox"></div>
    <div class="row"><label for="deny">模拟未授权</label><input id="deny" type="checkbox"></div>
    <div class="row"><label for="revert">模拟写入被系统回滚</label><input id="revert" type="checkbox"></div>
    <div class="state" id="state">state = off</div>
  </div>

  <div class="card legend">
    <b>四种结果</b><br>
    成功：图标换形 + 外环呼吸，塌缩后弧线变实变粗<br>
    Wi-Fi 未连：抖动 + 提示，压根不写<br>
    未授权：抖动 + 一次性授权命令<br>
    被回滚：写入后读回不一致，按失败处理
  </div>
</div>

<div class="phone" id="phone">
  <div class="screen">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="hint">任意应用界面 · 弧柄由无障碍服务覆盖其上</div>
    <div class="block"></div><div class="block"></div><div class="block"></div>
    <div class="block"></div><div class="block"></div><div class="block"></div>
    <div class="bubble">不用打开 VoxFix：点右侧弧线展开，第二枚按钮就是无线调试开关，状态直接写在图标上。</div>
  </div>

  <div class="handle" id="handle" title="点击/向内滑动展开">
    <svg width="24" height="64" viewBox="0 0 24 64">
      <path class="arc-path" d="M21 18 Q15 32 21 46"></path>
    </svg>
  </div>

  <div class="btn close" id="close" title="收起">
    <svg viewBox="0 0 48 48">
      <circle class="disc" cx="24" cy="24" r="15"></circle>
      <line class="ig" x1="20" y1="20" x2="28" y2="28" stroke-width="1.8"></line>
      <line class="ig" x1="28" y1="20" x2="20" y2="28" stroke-width="1.8"></line>
    </svg>
  </div>

  <div class="btn shot" id="shot" title="截图">
    <svg viewBox="0 0 48 48">
      <circle class="disc" cx="24" cy="24" r="21"></circle>
      <g class="ig" stroke-width="1.8">
        <path d="M16 22 V16 H22"></path><path d="M32 22 V16 H26"></path>
        <path d="M16 26 V32 H22"></path><path d="M32 26 V32 H26"></path>
        <line x1="22" y1="24" x2="26" y2="24" stroke-width="1.4"></line>
        <line x1="24" y1="22" x2="24" y2="26" stroke-width="1.4"></line>
      </g>
    </svg>
  </div>

  <div class="btn adb" id="adb" title="无线调试">
    <svg class="adb" viewBox="0 0 48 48" id="adbIcon">
      <circle class="disc" cx="24" cy="24" r="21"></circle>
      <circle class="ring" cx="24" cy="24" r="17.6"></circle>
      <path class="arc a1" pathLength="1" d="M17.86 25.85 A7.5 7.5 0 0 1 30.14 25.85"></path>
      <path class="arc a2" pathLength="1" d="M14.58 23.55 A11.5 11.5 0 0 1 33.42 23.55"></path>
      <path class="arc a3" pathLength="1" d="M10.49 20.68 A16.5 16.5 0 0 1 37.51 20.68"></path>
      <circle class="cdot" cx="24" cy="30.15" r="2.2"></circle>
      <line class="slash" pathLength="1" x1="11.5" y1="11.5" x2="36.5" y2="36.5"></line>
    </svg>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  const phone = document.getElementById('phone');
  const handle = document.getElementById('handle');
  const adbBtn = document.getElementById('adb');
  const closeBtn = document.getElementById('close');
  const icon = document.getElementById('adbIcon');
  const toastEl = document.getElementById('toast');
  const stateEl = document.getElementById('state');
  const wifi = document.getElementById('wifi');
  const deny = document.getElementById('deny');
  const revert = document.getElementById('revert');

  let on = false, busy = false, open = false;
  const phoneX = () => phone.getBoundingClientRect();

  function sync(){
    phone.classList.toggle('live', on);
    stateEl.textContent = `state = ${busy ? 'writing' : on ? 'on' : 'off'}`;
  }
  function toast(text){
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('show'), 2100);
  }
  function fail(text){
    adbBtn.classList.add('shake','flash');
    setTimeout(()=>adbBtn.classList.remove('shake','flash'), 360);
    toast(text);
  }

  handle.addEventListener('click', e => {
    e.stopPropagation();
    open = !open;
    phone.classList.toggle('open', open);
  });
  closeBtn.addEventListener('click', e => { e.stopPropagation(); open = false; phone.classList.remove('open'); });
  phone.addEventListener('click', () => { if (open){ open = false; phone.classList.remove('open'); } });
  document.getElementById('shot').addEventListener('click', e => { e.stopPropagation(); toast('截图：真实实现保持原有行为'); });

  adbBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (busy) return;

    if (deny.checked){
      fail('未授权 · adb shell pm grant local.voxfix.debug android.permission.WRITE_SECURE_SETTINGS');
      return;
    }
    if (!on && wifi.checked){
      fail('需先连接 Wi-Fi —— 否则系统会直接回滚这次开启');
      return;
    }

    busy = true; sync(); adbBtn.classList.add('busy');

    setTimeout(() => {
      adbBtn.classList.remove('busy');
      busy = false;

      if (!on && revert.checked){
        fail('写入被系统改回（NO_WIFI / 开发者选项已关闭）');
        sync(); return;
      }

      on = !on;
      icon.classList.toggle('on', on);
      sync();
    }, 700);
  });

  sync();
})();
</script>
</body>
</html>

<!doctype html><meta charset='utf-8'><title>录屏测试场景</title><style>body{margin:0;height:100vh;display:grid;place-items:center;font:700 42px sans-serif;background:#101418;color:#fff;overflow:hidden}#box{width:70vw;height:32vh;border-radius:18px;background:#1677ff;transition:background .4s}#clock{margin-top:24px;font-size:28px;color:#9ad}</style><div><div id='box'></div><div id='clock'>0.0s</div></div><script>let t=0;const start=performance.now();setInterval(()=>{t=(performance.now()-start)/1000;box.style.background=`hsl(${(t*90)%360} 80% 55%)`;box.style.transform=`translateX(${Math.sin(t)*12}vw)`;clock.textContent=t.toFixed(1)+'s';},50);</script>
